schema_version: "1.0"
contract_type: task
message_id: "MSG-YYYYMMDD-001"
project_id: "PROJECT-ID"
task_id: "TASK-YYYYMMDD-001"
parent_task_id: null
title: "Short task title"
status: ready # draft | ready | approved | in_progress | blocked | verifying | completed | cancelled
owner_agent: technical
issued_by: manager
recipient: technical
approval_ref: "APPROVAL-ID"
created_at: "YYYY-MM-DDTHH:MM:SSZ"

objective: "One clear, verifiable objective."
scope:
  included:
    - "Explicit in-scope item"
  excluded:
    - "Explicit out-of-scope item"

acceptance_criteria:
  - id: AC-001
    description: "Observable completion condition"
    verification: "Command, test, or inspection evidence"

dependencies: []
context:
  graph_nodes: []
  information_refs: []
  files_to_inspect: []
  collection_batch_ref: null

constraints:
  language: "Persian prose; technical identifiers remain English"
  terminal_steps: "One clear objective per step"
  workflow: "AUDIT -> APPLY -> VERIFY"
  human_runs_commands_if_no_direct_access: true

risk_level: low # low | medium | high
approval_required_for:
  - "Architecture changes"
  - "Out-of-scope changes"
  - "High-risk or irreversible actions not explicitly covered by approval"

expected_outputs:
  - "Execution report addressed to Manager"
  - "Changed files or copy-ready commands"

notes: []
